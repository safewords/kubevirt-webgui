{{- if and .Values.appKey.generate (not .Values.appKey.existingSecret) }}
# The key that seals sign-in and console tickets.
#
# Generated once and read back on every upgrade, so redeploying does not sign
# everybody out. It holds no cluster credentials: users' Kubernetes tokens are
# sealed *with* it, never stored, so losing it invalidates open sessions and
# nothing else.
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-key" (include "kubevirt-webgui.fullname" .) }}
  labels:
    {{- include "kubevirt-webgui.labels" . | nindent 4 }}
type: Opaque
data:
  APP_KEY: {{ include "kubevirt-webgui.appKey" . }}
{{- end }}
