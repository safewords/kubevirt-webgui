{{- if .Values.serviceAccount.create }}
# Bound to nothing, and that is the point: the server acts as the signed-in
# user, never as itself. If you find yourself giving this ServiceAccount a
# ClusterRoleBinding, something has gone wrong — the GUI needs no permissions
# of its own, and granting them would make every visitor as powerful as it is.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubevirt-webgui.serviceAccountName" . }}
  labels:
    {{- include "kubevirt-webgui.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
