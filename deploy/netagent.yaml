# kubevirt-webgui-netagent — off-subnet client NAT for bridged (Multus) VMs.
#
# Optional, and separate from the GUI on purpose: the GUI holds no privileges,
# and this does. It runs on every KubeVirt node in the host's PID namespace and
# enters launcher pods' network namespaces to keep the NAT rules a VM's
# Network → Off-subnet client NAT panel asks for. Its RBAC reads VMIs and
# writes one annotation on them. See docs/features/networking.md.
#
#   kubectl apply -f deploy/kubevirt-webgui.yaml   # the namespace comes from here
#   kubectl apply -f deploy/netagent.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubevirt-webgui-netagent
  namespace: kubevirt-webgui
  labels:
    app.kubernetes.io/name: kubevirt-webgui-netagent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubevirt-webgui-netagent
  labels:
    app.kubernetes.io/name: kubevirt-webgui-netagent
rules:
  # Read every VMI, and write one annotation on it: the status.
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubevirt-webgui-netagent
  labels:
    app.kubernetes.io/name: kubevirt-webgui-netagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubevirt-webgui-netagent
subjects:
  - kind: ServiceAccount
    name: kubevirt-webgui-netagent
    namespace: kubevirt-webgui
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubevirt-webgui-netagent
  namespace: kubevirt-webgui
  labels:
    app.kubernetes.io/name: kubevirt-webgui-netagent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kubevirt-webgui-netagent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubevirt-webgui-netagent
    spec:
      serviceAccountName: kubevirt-webgui-netagent
      # /proc of every process on the node, to find each VM's QEMU and enter
      # its pod's network namespace; the node's network, for its ARP table.
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubevirt.io/schedulable: "true"
      containers:
        - name: netagent
          image: ghcr.io/safewords/kubevirt-webgui-netagent:main
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NETAGENT_INTERVAL
              value: "15"
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # NET_ADMIN: iptables, routes, neighbours. SYS_ADMIN: setns.
              # SYS_PTRACE: reading another user's /proc/<pid>/ns. NET_RAW:
              # the one ping that fills an empty ARP entry for the gateway.
              add: ["NET_ADMIN", "SYS_ADMIN", "SYS_PTRACE", "NET_RAW"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            # iptables takes a lock under /run.
            - name: run
              mountPath: /run
      volumes:
        - name: run
          emptyDir:
            medium: Memory
