# kubevirt-webgui — in-cluster deployment.
#
# The server holds no privileges: its ServiceAccount is bound to nothing. Users
# sign in with their own Kubernetes tokens and every request is made with
# them, so cluster RBAC is the only authorisation.
#
# Before applying, create the key that seals sign-in tickets:
#
#   kubectl -n kubevirt-webgui create secret generic kubevirt-webgui-key \
#     --from-literal=APP_KEY="base64:$(head -c 32 /dev/urandom | base64)"
---
apiVersion: v1
kind: Namespace
metadata:
  name: kubevirt-webgui
  labels:
    app.kubernetes.io/name: kubevirt-webgui
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubevirt-webgui
  namespace: kubevirt-webgui
  labels:
    app.kubernetes.io/name: kubevirt-webgui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubevirt-webgui
  namespace: kubevirt-webgui
  labels:
    app.kubernetes.io/name: kubevirt-webgui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubevirt-webgui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubevirt-webgui
    spec:
      serviceAccountName: kubevirt-webgui
      # Mounted only for the API server's address and CA; the token grants nothing.
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: regcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubevirt-webgui
          image: oci-registry.safewords.com/kubevirt-webgui:20260916191334
          imagePullPolicy: IfNotPresent
          args: ["serve", "--host=0.0.0.0", "--port=8006"]
          ports:
            - name: http
              containerPort: 8006
          env:
            - name: APP_ENV
              value: production
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: kubevirt-webgui-key
                  key: APP_KEY
            - name: AUTH_ALLOW_SERVER_IDENTITY
              value: "false"
            - name: GUI_PRODUCT_NAME
              value: kubevirt-webgui
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: kubevirt-webgui
  namespace: kubevirt-webgui
  labels:
    app.kubernetes.io/name: kubevirt-webgui
spec:
  selector:
    app.kubernetes.io/name: kubevirt-webgui
  ports:
    - name: http
      port: 8006
      targetPort: http
