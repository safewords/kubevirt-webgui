[package]
name = "kubevirt-webgui"
version = "0.1.0"
edition = "2024"
description = "An extensible, Proxmox-inspired web GUI for KubeVirt (libvirt on Kubernetes)."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
rainier-framework = { git = "https://github.com/safewords/rainier-framework.git" }

kube = { version = "4.2", default-features = false, features = ["client", "config", "rustls-tls", "ring", "ws"] }
k8s-openapi = { version = "0.28", features = ["latest"] }

async-trait = "0.1"
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
http = "1"
rand = "0.8"
sha2 = "0.10"
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
tokio-tungstenite = "0.29"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
secrecy = "0.10"
hex = "0.4"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
# Uploads to CDI's upload proxy: TLS over a direct socket or a port-forward.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
# Proxmox import: SSH to the source host (pure Rust, ring crypto like the rest).
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }
