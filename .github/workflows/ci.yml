name: CI

# Both halves of the application are checked here: the Rust server and the
# browser app. The e2e suite under web/e2e is not — it drives a real cluster
# with KubeVirt and CDI on it, which no hosted runner has.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Browser app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Types
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build:fast
      # The server embeds this directory, so the Rust job needs it too.
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  rust:
    name: Server
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rust-embed compiles web/dist in for release builds and tolerates it
      # missing, so a debug check would pass with no app in the binary. Using
      # the real thing here keeps that from being discovered at deploy time.
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  image:
    name: Image builds
    # Only proves the Dockerfile still builds; publishing is release.yml's job.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
